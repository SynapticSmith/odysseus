name: Check Architecture Doc

on:
  pull_request:
    paths:
      - 'docs/ARCHITECTURE.md'

permissions: {}
jobs:
  check-balance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Run detail tag balance check
        run: |
          python scripts/check_architecture_doc.py docs/ARCHITECTURE.md
